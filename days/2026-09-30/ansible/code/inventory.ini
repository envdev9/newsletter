# Fikcyjna flota: 8 "serwerow aplikacyjnych" do testu serial+throttle (potrzebne 8, zeby
# serial: 4 dalo dokladnie 2 paczki), plus osobna grupa 5-hostowa do testu run_once +
# serial z NIEROWNA lista [1, 3] (1 + 3 = 4, piaty host to "resztka" ponad liste).
# Wszystkie to ta sama maszyna pod ansible_connection=local - bez prawdziwej floty SSH.

[app_all]
app1 ansible_connection=local
app2 ansible_connection=local
app3 ansible_connection=local
app4 ansible_connection=local
app5 ansible_connection=local
app6 ansible_connection=local
app7 ansible_connection=local
app8 ansible_connection=local

# Podzbior pierwszych 5 hostow z app_all - do testu run_once + serial: [1, 3].
# Vary (ansible_connection) sa juz zdefiniowane wyzej, tu tylko czlonkostwo w grupie.
# Nazwa celowo INNA niz jakikolwiek hostname (app1..app8), zeby uniknac ostrzezenia
# Ansible "Found both group and host with same name".
[app_uneven]
app1
app2
app3
app4
app5

---
# Rola zespołu A dopisuje swój blok do WSPÓLNEGO pliku.
# fix_markers=false -> domyślny marker (ten sam co u zespołu B) = KOLIZJA.
# fix_markers=true  -> marker z nazwą roli = każdy blok ma własną tożsamość.
- name: "team_a: blok z limitami do wspólnego pliku"
  ansible.builtin.blockinfile:
    path: "{{ shared_file }}"
    create: true
    mode: "0644"
    marker: "{{ '# {mark} team_a' if fix_markers | bool else '# {mark} ANSIBLE MANAGED BLOCK' }}"
    block: |
      limit_a=100
      timeout_a=30

---
# "Sygnatura metody" roli: typy, wymagalnosc, dozwolone wartosci.
# Ansible waliduje to ZANIM wykona pierwszy task roli.
argument_specs:
  main:
    short_description: Zapisuje opis jednostki uslugi (plik tekstowy).
    options:
      svc_name:
        type: str
        required: true
        description: Nazwa uslugi (bez wartosci domyslnej - parametr obowiazkowy).
      svc_port:
        type: int
        default: 8080
        description: Port nasluchu.
      svc_env:
        type: str
        default: dev
        choices: [dev, stage, prod]
        description: Srodowisko.
      svc_replicas:
        type: int
        default: 1
        description: Liczba replik.
      svc_dir:
        type: path
        default: /tmp/ansible-demo-lvl18/units
        description: Katalog docelowy.

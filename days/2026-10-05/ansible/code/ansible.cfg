[defaults]
callback_plugins = ./callback_plugins
callbacks_enabled = task_duration
stdout_callback = default

fact_caching = jsonfile
fact_caching_connection = /tmp/ansible-demo-lvl13/factcache
fact_caching_timeout = 86400

[callback_task_duration]
# UWAGA: log musi lezec POZA katalogiem demo, inaczej playbook cleanup.yml,
# ktory usuwa caly /tmp/ansible-demo-lvl13, sam go "wskrzesza" wlasnym
# wpisem logu z ostatniego taska (patrz ARTICLE.md, sekcja o tej pulapce).
log_path = /tmp/ansible-demo-lvl13-task-duration.log

# Fikcyjna flota do dwoch eksperymentow z wydania #8:
#
# [pct_hosts] - 8 "serwerow web" do testu serial z wartoscia PROCENTOWA (np. "25%", "40%",
# "10%"). 8 hostow wybrane tak, zeby jeden procent dawal rownowage, a inny wymuszal
# zaokraglenie (8 * 0.25 = 2.0 dokladnie, ale 8 * 0.4 = 3.2 i 8 * 0.1 = 0.8 - juz nie).
#
# [uneven_hosts] - 7 "serwerow batch" do testu throttle: 2 na tasku w playu z serial: 3.
# 3 nie dzieli sie rowno przez 2 (nierowna "fala" throttle wewnatrz paczki), a 7 nie dzieli
# sie rowno przez 3 (nierowna OSTATNIA paczka serial, rozmiar 1 - mniejsza nawet niz throttle).
#
# Wszystkie hosty to ta sama maszyna pod ansible_connection=local - bez prawdziwej floty SSH.
# Nazwy grup celowo inne niz jakikolwiek hostname (unikamy ostrzezenia Ansible "Found both
# group and host with same name", zlapanego w #7).

[pct_hosts]
web1 ansible_connection=local
web2 ansible_connection=local
web3 ansible_connection=local
web4 ansible_connection=local
web5 ansible_connection=local
web6 ansible_connection=local
web7 ansible_connection=local
web8 ansible_connection=local

[uneven_hosts]
s1 ansible_connection=local
s2 ansible_connection=local
s3 ansible_connection=local
s4 ansible_connection=local
s5 ansible_connection=local
s6 ansible_connection=local
s7 ansible_connection=local

# [freeze_hosts] - 3 hosty do BONUSOWEGO eksperymentu (punkt 4 z listy "do zrobienia" po #6/#7):
# czy "zamrazanie" nazwy taska w TASK [...] z {{ inventory_hostname }} w name: wystepuje TYLKO
# przy serial, czy tez w zwyklych, osobnych playach (bez serial) i w loop + delegate_to.
[freeze_hosts]
h1 ansible_connection=local
h2 ansible_connection=local
h3 ansible_connection=local

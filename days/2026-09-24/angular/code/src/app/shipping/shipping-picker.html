<section class="card">
  <h3>2. linkedSignal() - stan wyliczony, ale ręcznie nadpisywalny</h3>
  <p>
    <button (click)="setCountry('PL')" [disabled]="country() === 'PL'">Kraj: PL</button>
    <button (click)="setCountry('DE')" [disabled]="country() === 'DE'">Kraj: DE</button>
  </p>
  <ul>
    @for (option of options(); track option.id) {
      <li>
        <label>
          <input
            type="radio"
            name="shipping"
            [checked]="selectedShipping().id === option.id"
            (change)="selectShipping(option)"
          />
          {{ option.label }} - {{ option.price }} zł
        </label>
      </li>
    }
  </ul>
  <p>Wybrano: <strong>{{ selectedShipping().label }}</strong> ({{ total() }} zł)</p>
  <p>
    <small>
      Zmień kraj (nawet po ręcznym wyborze kuriera) - wybór resetuje się do
      najtańszej opcji dla nowego kraju.
    </small>
  </p>
</section>

# PRZYKLAD - NIEZWERYFIKOWANY (nie uruchomiony na zadnym runnerze; komenda `claude` byla w tym
# srodowisku niedostepna). Nazwa pakietu npm, flagi i sekret sa Z PAMIECI - sprawdz dokumentacje.
name: agent-gate
on:
  pull_request:

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15            # twardy limit calego joba (druga linia obrony po --max-turns)
    permissions:
      contents: read               # agent nie ma prawa pisac do repo
    steps:
      - uses: actions/checkout@v4
      - name: Zainstaluj CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Agent + bramka
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: >
          python3 ci_gate.py
          --agent "claude -p 'Napraw czerwone testy' --output-format json --max-turns 10 --allowedTools 'Read,Edit,Bash(dotnet test*)'"
          --verify "dotnet test"
          --max-turns 10 --timeout 600

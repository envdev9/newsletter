; Fikcyjna flota do testow serial procentowego + throttle/run_once.
; Wszystko ansible_connection=local - zero prawdziwego SSH, zero prawdziwej infrastruktury.
;
; 8 hostow w grupie "flota": serial: "40%" na 8 hostach daje (wydanie #8) paczki 3,3,2
; (floor(8*0.4)=3, reszta 2 w ostatniej paczce) - dzis uzywamy TEGO SAMEGO podzialu do
; dwoch nowych testow: throttle na kazdej z tych paczek, i run_once na kazdej z nich.

[flota]
n1 ansible_connection=local
n2 ansible_connection=local
n3 ansible_connection=local
n4 ansible_connection=local
n5 ansible_connection=local
n6 ansible_connection=local
n7 ansible_connection=local
n8 ansible_connection=local

[flota:vars]
ansible_python_interpreter=auto_silent

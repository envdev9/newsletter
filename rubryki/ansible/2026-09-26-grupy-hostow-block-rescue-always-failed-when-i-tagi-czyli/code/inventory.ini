# Trzy "hosty", wszystkie to ta sama maszyna (ansible_connection=local).
# Nazwy (web1, web2, db1) sa tylko etykietami - dzieki nim widac dzialanie grup.
[web]
web1 ansible_connection=local
web2 ansible_connection=local

[db]
db1 ansible_connection=local

# grupa grup: [nazwa:children]
[app:children]
web
db
